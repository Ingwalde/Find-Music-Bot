name: tg-bot

services:
  postgres:
    image: postgres:16-alpine
    container_name: music-bot-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"  # exposed for host access (migration script + local dev)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: music-bot-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  music-bot:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: tg-bot
    container_name: telegram-music-finder-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    ports:
      - "9090:9090"  # exposed for host-side uptime monitoring / docker healthcheck
      - "8443:8443"  # webhook mode (v3.3.0+) — TLS terminated by the app itself
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  test-postgres:
    image: postgres:16-alpine
    container_name: music-bot-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: testdb
    ports:
      - "127.0.0.1:5433:5432"
    profiles:
      - test

  test-redis:
    image: redis:7-alpine
    container_name: music-bot-test-redis
    ports:
      - "127.0.0.1:6380:6379"
    profiles:
      - test

volumes:
  postgres-data:
