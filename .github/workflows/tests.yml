name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  tests:
    name: Ruff, Pytest Coverage, Release Cleanup and Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      BOT_TOKEN: test-token
      GENIUS_TOKEN: test-token
      SPOTIFY_ENABLED: "false"
      SPOTIFY_CLIENT_ID: test-client-id
      SPOTIFY_CLIENT_SECRET: test-client-secret
      ADMIN_ID: "123456789"
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      LOG_FILE_PATH: logs/test_bot.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: python -m pytest

      - name: Validate release cleanup
        run: python scripts/check_release_clean.py

      - name: Check locale coverage
        run: python scripts/check_locale_coverage.py

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t find-music-bot:test .
