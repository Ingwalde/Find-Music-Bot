name: Tests

on:
  push:
    branches:
      - main
      - master
  # deps/staging is in the pull_request list but deliberately not in push:
  # Dependabot targets that branch, so without it here its PRs merged with no
  # checks at all and the first validation happened on the promotion PR to main,
  # with every bump landing at once. On push it would only re-run the same suite
  # for the daily sync merge and for each deps PR merge, which validates nothing
  # new.
  pull_request:
    branches:
      - main
      - master
      - deps/staging

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      # The checked module list lives in pyproject.toml ([tool.mypy] files),
      # so this step never drifts out of sync when a module is promoted.
      - name: Run mypy on typed modules
        run: python -m mypy

      - name: Scan dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements/base.txt

      - name: Validate release cleanup
        run: python scripts/check_release_clean.py

      - name: Check version consistency
        run: python scripts/check_version_sync.py

      - name: Check env example coverage
        run: python scripts/check_env_example.py

      - name: Check locale coverage
        run: python scripts/check_locale_coverage.py

  test:
    name: Pytest Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6380:6379

    env:
      BOT_TOKEN: test-token
      GENIUS_TOKEN: test-token
      SPOTIFY_ENABLED: "false"
      SPOTIFY_CLIENT_ID: test-client-id
      SPOTIFY_CLIENT_SECRET: test-client-secret
      ADMIN_ID: "123456789"
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      REDIS_URL: redis://localhost:6380
      LOG_FILE_PATH: logs/test_bot.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: python -m pytest

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          # On PRs the image is loaded into the local daemon so Trivy can scan
          # the image this PR actually produces, not the published :latest.
          load: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # :latest is what docker-compose.yml pulls and must keep moving.
          # The sha- tag is the immutable half: :latest is reassigned on every
          # push, so before this there was no name for "the image main was on
          # last Tuesday" and no way to roll back to one. Recovering from a bad
          # deploy meant reverting the commit and waiting for a rebuild.
          #
          # It also gives the deploy something to verify against. The stale
          # image that shipped nothing from v3.7.7 to v3.7.9 was only caught by
          # comparing digests after the fact; a pinned tag makes "which build
          # is this?" answerable directly.
          tags: |
            ghcr.io/ingwalde/find-music-bot:latest
            ghcr.io/ingwalde/find-music-bot:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ignore-unfixed: the python:3.12-slim base carries CVEs with no upstream
      # patch available; failing on those would block every PR with no action
      # the project can take. Fixable HIGH/CRITICAL findings do block.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ingwalde/find-music-bot:latest
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
