name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  tests:
    name: Ruff, Pytest Coverage, Release Cleanup and Docker Build
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: test-token
      GENIUS_TOKEN: test-token
      SPOTIFY_ENABLED: "false"
      SPOTIFY_CLIENT_ID: test-client-id
      SPOTIFY_CLIENT_SECRET: test-client-secret
      ADMIN_ID: "123456789"
      DATABASE_PATH: data/test_music_bot.db
      LOG_FILE_PATH: logs/test_bot.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests with coverage
        run: python -m pytest

      - name: Validate release cleanup
        run: python scripts/check_release_clean.py

      - name: Build Docker image
        run: docker build -t find-music-bot:test .
