name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run mypy on typed modules
        run: |
          python -m mypy \
            app/utils/types.py \
            app/utils/http_client.py \
            app/services/deezer_service.py \
            app/services/lyrics_service.py \
            app/platforms/aggregator.py \
            app/platforms/spotify/client.py \
            app/services/track_formatter.py \
            app/services/recommendations_service.py \
            app/bot/rate_limit.py \
            app/health.py \
            app/monitoring.py

      - name: Scan dependencies for known vulnerabilities
        run: python -m pip_audit -r requirements/base.txt

      - name: Validate release cleanup
        run: python scripts/check_release_clean.py

      - name: Check env example coverage
        run: python scripts/check_env_example.py

      - name: Check locale coverage
        run: python scripts/check_locale_coverage.py

  test:
    name: Pytest Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 6380:6379

    env:
      BOT_TOKEN: test-token
      GENIUS_TOKEN: test-token
      SPOTIFY_ENABLED: "false"
      SPOTIFY_CLIENT_ID: test-client-id
      SPOTIFY_CLIENT_SECRET: test-client-secret
      ADMIN_ID: "123456789"
      DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      REDIS_URL: redis://localhost:6380
      LOG_FILE_PATH: logs/test_bot.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: python -m pytest

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          tags: find-music-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
