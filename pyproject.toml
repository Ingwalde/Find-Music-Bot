[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "app.utils.types",
    "app.utils.http_client",
    "app.services.deezer_service",
    "app.services.lyrics_service",
    "app.platforms.aggregator",
    "app.platforms.spotify.client",
    "app.services.track_formatter",
    "app.services.recommendations_service",
    "app.bot.rate_limit",
    "app.health",
    "app.monitoring",
]
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["app.utils.http_retry"]
ignore_errors = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
