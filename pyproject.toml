[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml"
asyncio_mode = "strict"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
check_untyped_defs = true
# The whole package is checked. It used to be an explicit 25-module list; the
# 61 modules outside it carried 91 real type errors that nobody ran, including
# the None-dereference that crashed every callback on a message older than 48h.
# Checking everything makes that class of drift structurally impossible — a new
# module cannot be added without passing.
files = ["app"]

[[tool.mypy.overrides]]
module = [
    "app.utils.types",
    "app.utils.http_client",
    "app.utils.http_retry",
    "app.services.deezer_service",
    "app.services.lyrics_service",
    "app.services.search_cache_service",
    "app.platforms.aggregator",
    "app.platforms.spotify.client",
    "app.services.track_formatter",
    "app.services.recommendations_service",
    "app.bot.rate_limit",
    "app.bot.context",
    "app.config.settings",
    "app.database.repository_modules.common",
    "app.database.repository_modules.users",
    "app.database.repository_modules.tracks",
    "app.database.repository_modules.searches",
    "app.database.repository_modules.favorites",
    "app.database.repository_modules.errors",
    "app.database.repository_modules.spotify",
    "app.database.repository_modules.search_cache",
    "app.database.repository_modules.admin_audit",
    "app.health",
    "app.monitoring",
]
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
